<div class="hero-anchor" id="inicio_id"></div>
<main class="masthead" [class.hero-is-visible]="isVisible">
    <div class="cover-image">
        <img src="assets/present.jpeg" alt="Carlos Gutiérrez">
    </div>
    <div class="color-overlay"></div>
    <div class="hero-content">
        <div class="hero-grid">
            <div class="hero-kicker">
                <span>01</span>
                <strong>{{ 'FULL STACK DEV' | translate }}</strong>
                <small>{{ 'VALENCIA, ES' | translate }}</small>
            </div>
            <div class="hero-name">
                <h1>Carlos Gutiérrez</h1>
            </div>
            <p class="hero-intro">
                {{ 'Desarrollo software desde la interfaz hasta el backend y el despliegue.' | translate }}
            </p>
            <div class="hero-footer">
                <a class="hero-contact" href="#contact_id">{{ 'Hablemos' | translate }}</a>
                <span class="hero-scroll">{{ 'Desplázate para descubrir' | translate }}</span>
            </div>
        </div>
    </div>
</main>
